<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Roshan Digital — Secure Online Investment & Earning Platform" />
    <meta name="apple-mobile-web-app-title" content="Roshan Digital" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192-v2.png" />
    <link rel="apple-touch-icon" href="/icon-192-v2.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>Roshan Digital</title>
    <style>
      body { background: #ffffff; }
      #root:empty { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #root:empty::after {
        content: '';
        width: 36px; height: 36px;
        border: 3px solid #E5E7EB;
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: bootstrap-spin 0.8s linear infinite;
      }
      @keyframes bootstrap-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
